<!DOCTYPE html>
<html lang="en" data-theme="navy" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Tyson Shields</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page { min-height: 100vh; display: grid; place-items: center; text-align: center; }
    .error-content { width: min(100% - 2rem, 620px); }
    .error-content h1 { margin: 1rem 0; color: var(--accent); font-size: clamp(6rem, 20vw, 13rem); }
    .error-content p { margin: 0 auto 2rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <a class="brand" href="/"><span class="brand-mark">TS</span><span>Tyson Shields</span></a>
      <h1>404</h1>
      <p>The page you’re looking for moved somewhere more interesting.</p>
      <a class="button button-primary" href="/">Return home <span>↗</span></a>
    </div>
  </div>
</body>
</html>
