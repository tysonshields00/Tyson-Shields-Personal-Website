<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Tyson Shields</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #111;
      color: #fff;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    h1 {
      font-size: 5rem;
      margin: 0;
      color: #f87171;
    }
    p {
      color: #9ca3af;
      font-size: 1.25rem;
      margin: 1rem 0 2rem;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Sorry, the page you are looking for does not exist.</p>

</html>
