<div class="drawer-backdrop" data-close-drawer></div>
<aside class="settings-drawer" id="settings-drawer" aria-labelledby="settings-title" aria-hidden="true">
  <div class="drawer-header">
    <div>
      <p class="section-kicker">Display controls</p>
      <h2 id="settings-title">Display Settings</h2>
    </div>
    <button class="icon-button drawer-close" type="button" aria-label="Close display settings">×</button>
  </div>
  <div class="setting-group">
    <span class="setting-label">Mode</span>
    <div class="choice-grid three-choice">
      <button type="button" data-setting="theme" data-value="dark" aria-expanded="true"><span class="theme-dot" style="background:#00f0ff;"></span><span>Dark</span></button>
      <button type="button" data-setting="theme" data-value="light" aria-expanded="false"><span class="theme-dot" style="background:#f4f5f6;"></span><span>Light</span></button>
      <button type="button" data-setting="theme" data-value="reading" aria-expanded="false"><span class="theme-dot" style="background:#f5edd6;"></span><span>Reading</span></button>
    </div>
  </div>
  <div class="setting-group">
    <span class="setting-label">Accent</span>
    <div class="accent-choices">
      <button class="accent-choice accent-blue" type="button" data-setting="accent" data-value="blue" aria-label="Electric Cyan"></button>
      <button class="accent-choice accent-teal" type="button" data-setting="accent" data-value="teal" aria-label="Neon Teal"></button>
      <button class="accent-choice accent-emerald" type="button" data-setting="accent" data-value="emerald" aria-label="Cyber Emerald"></button>
      <button class="accent-choice accent-amber" type="button" data-setting="accent" data-value="amber" aria-label="Solar Amber"></button>
      <button class="accent-choice accent-purple" type="button" data-setting="accent" data-value="purple" aria-label="Electric Purple"></button>
      <button class="accent-choice accent-white" type="button" data-setting="accent" data-value="white" aria-label="Crisp White"></button>
    </div>
  </div>
  <div class="setting-group">
    <span class="setting-label">Density</span>
    <div class="choice-grid two-choice">
      <button type="button" data-setting="density" data-value="spacious">Spacious</button>
      <button type="button" data-setting="density" data-value="compact">Compact</button>
    </div>
  </div>
  <div class="setting-group setting-toggle">
    <div>
      <span class="setting-label">Reduced motion</span>
      <small>Keep things steady.</small>
    </div>
    <button class="toggle" type="button" data-setting="motion" data-value="reduced" role="switch" aria-checked="false">
      <span></span>
      <span class="sr-only">Toggle reduced motion</span>
    </button>
  </div>
  <button class="reset-button" type="button" data-reset>Reset to defaults</button>
</aside>
