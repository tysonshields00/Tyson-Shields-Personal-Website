<div class="drawer-backdrop" data-close-drawer></div>
<aside class="settings-drawer" id="settings-drawer" aria-labelledby="settings-title" aria-hidden="true">
  <div class="drawer-header">
    <div>
      <p class="section-kicker">Appearance</p>
      <h2 id="settings-title">Theme Settings</h2>
    </div>
    <button class="icon-button drawer-close" type="button" aria-label="Close settings">×</button>
  </div>

  <div class="setting-group">
    <span class="setting-label">Theme Mode</span>
    <div class="choice-grid two-choice theme-grid">
      <button type="button" data-setting="theme" data-value="dark" aria-pressed="true">
        <span class="theme-dot theme-dot--dark"></span>
        <span>Dark (Navy)</span>
      </button>
      <button type="button" data-setting="theme" data-value="slate" aria-pressed="false">
        <span class="theme-dot theme-dot--slate"></span>
        <span>Slate (Tech)</span>
      </button>
      <button type="button" data-setting="theme" data-value="reading" aria-pressed="false">
        <span class="theme-dot theme-dot--reading"></span>
        <span>Editorial</span>
      </button>
      <button type="button" data-setting="theme" data-value="light" aria-pressed="false">
        <span class="theme-dot theme-dot--light"></span>
        <span>Light Mode</span>
      </button>
    </div>
  </div>

  <div class="setting-group">
    <span class="setting-label">Accent Color</span>
    <div class="choice-grid two-choice accent-grid">
      <button type="button" data-setting="accent" data-value="blue" aria-pressed="true">
        <span class="theme-dot theme-dot--blue"></span>
        <span>Electric Sky</span>
      </button>
      <button type="button" data-setting="accent" data-value="teal" aria-pressed="false">
        <span class="theme-dot theme-dot--teal"></span>
        <span>Mint Emerald</span>
      </button>
      <button type="button" data-setting="accent" data-value="amber" aria-pressed="false">
        <span class="theme-dot theme-dot--amber"></span>
        <span>Warm Amber</span>
      </button>
      <button type="button" data-setting="accent" data-value="purple" aria-pressed="false">
        <span class="theme-dot theme-dot--purple"></span>
        <span>Neon Violet</span>
      </button>
    </div>
  </div>

  <div class="setting-group">
    <span class="setting-label">Display Density</span>
    <div class="choice-grid two-choice">
      <button type="button" data-setting="density" data-value="spacious" aria-pressed="true">
        <span>Spacious</span>
      </button>
      <button type="button" data-setting="density" data-value="compact" aria-pressed="false">
        <span>Compact</span>
      </button>
    </div>
  </div>

  <div class="setting-group">
    <span class="setting-label">Quick Search &amp; Actions</span>
    <button type="button" class="button button-secondary palette-trigger drawer-palette-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="drawer-palette-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Open Command Palette (Ctrl+K)</span>
    </button>
  </div>
</aside>
